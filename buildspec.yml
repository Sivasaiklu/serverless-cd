version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
  build:
    commands:
      - echo "Building the application..."
      - aws cloudformation package \
          --template-file template.yaml \
          --s3-bucket YOUR_S3_BUCKET_NAME \
          --output-template-file packaged.yaml

artifacts:
  files:
    - packaged.yaml
